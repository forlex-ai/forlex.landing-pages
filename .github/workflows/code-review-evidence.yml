name: Final review evidence request

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number in this repository
        required: true
        type: number
      stage:
        description: Requested evidence stage in the private backend
        required: true
        default: prepared
        type: choice
        options: [prepared, approved, merged, verified]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-request-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  request:
    name: Publish review request metadata
    if: >-
      github.event_name != 'pull_request_review' ||
      (github.event.review.user.id == 90110233 && github.event.review.user.login == 'danielbichuetti')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read final PR revision as public facts
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          REQUESTED_STAGE: ${{ inputs.stage || (github.event.action == 'closed' && 'merged' || 'prepared') }}
          POLICY_SHA: ${{ vars.REVIEW_EVIDENCE_POLICY_SHA }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          number = int(os.environ['PR_NUMBER'])
          if number < 1:
              raise SystemExit('PR number must be positive')
          repository = os.environ['GITHUB_REPOSITORY']
          pr = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/pulls/{number}'], text=True))
          request = {
              'schema_version': 'review-request/v1',
              'repository': repository,
              'pr_number': number,
              'head_sha': pr['head']['sha'],
              'base_sha': pr['base']['sha'],
              'requested_stage': os.environ['REQUESTED_STAGE'],
              'policy_reference': os.environ['POLICY_SHA'],
              'backend_observer': 'forlex-ai/platform.backend/.github/workflows/public-repository-review-evidence.yml',
          }
          Path('review-request.json').write_text(json.dumps(request, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('head_sha=' + pr['head']['sha'] + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f'Review request: {repository}#{number}, head {pr["head"]["sha"]}.\n\nThe private backend observer authenticates the bundle, CI, Daniel decision and merge and stores the signed envelope. This public artifact contains request metadata only.\n')
          PY
      - name: Retain public request metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-request-${{ inputs.pr_number || github.event.pull_request.number }}-${{ steps.request.outputs.head_sha }}-${{ github.run_id }}
          path: review-request.json
          if-no-files-found: error
          retention-days: 30
