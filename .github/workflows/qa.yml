name: qa

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No npm cache / npm ci: this repo has zero dependencies (no lockfile).
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          LP_BASE_URL: https://lp.forlex.ai
          LP_POSTHOG_HOST: https://b.forlex.ai
          LP_ROBOTS: noindex
          LP_DISABLE_TRACKING: 'true'
      - run: npm run qa:built
